<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="전체 화면 시계">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>Clock Screen</title>

  <style>
    /* ===== 여기의 값만 바꾸면 화면을 조정할 수 있습니다 ===== */
    :root {
      --date-y: 75%;
      --time-y: 81%;
      --icon-x: 50%;
      --icon-y: 90%;
      --date-size: 18px;
      --time-size: 32px;
      --text-color: #ffffff;
      --spin-speed: 2s;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    body {
      color: var(--text-color);
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      overscroll-behavior: none;
    }
    .background {
      position: fixed;
      inset: 0;
      background-image: url("./background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .label {
      position: fixed;
      left: 0;
      width: 100%;
      text-align: center;
      transform: translateY(-50%);
      text-shadow: 0 1px 8px #000;
      font-variant-numeric: tabular-nums;
      padding-inline: 12px;
      pointer-events: none;
    }
    #date { top: var(--date-y); font-size: var(--date-size); }
    #time { top: var(--time-y); font-size: var(--time-size); font-weight: 500; }
    
/* 24분할 도넛 로딩 아이콘 */
#spinner {
  position: fixed;
  left: var(--icon-x);
  top: var(--icon-y);

  width: 256px;
  height: 256px;

  /* 24개 영역, 각 영역 15도 */
  background: conic-gradient(
    from 0deg,
    #ffffff 0deg 15deg,
    #f5f5f5 15deg 30deg,
    #ebebeb 30deg 45deg,
    #e1e1e1 45deg 60deg,
    #d7d7d7 60deg 75deg,
    #cdcdcd 75deg 90deg,
    #c3c3c3 90deg 105deg,
    #b9b9b9 105deg 120deg,
    #afafaf 120deg 135deg,
    #a5a5a5 135deg 150deg,
    #9b9b9b 150deg 165deg,
    #919191 165deg 180deg,
    #878787 180deg 195deg,
    #7d7d7d 195deg 210deg,
    #737373 210deg 225deg,
    #696969 225deg 240deg,
    #5f5f5f 240deg 255deg,
    #555555 255deg 270deg,
    #4b4b4b 270deg 285deg,
    #414141 285deg 300deg,
    #373737 300deg 315deg,
    #2d2d2d 315deg 330deg,
    #232323 330deg 345deg,
    #191919 345deg 360deg
  );

  /* 중앙을 뚫어 도넛 형태로 만들기 */
  -webkit-mask:
  radial-gradient(circle, transparent 0 76%, #000 77% 100%);
mask:
  radial-gradient(circle, transparent 0 76%, #000 77% 100%);

border-radius: 50%;

  transform: translate(-50%, -50%);
  animation: spin var(--spin-speed: 2s) steps(24) infinite;
}

@keyframes spin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; }
    }
    /* 설치 버튼은 Chrome이 설치 프롬프트를 제공할 때만 표시 */
    #installButton {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 10;
      border: 1px solid #ffffff88;
      border-radius: 999px;
      padding: 8px 12px;
      color: white;
      background: #111a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div id="date" class="label"></div>
  <div id="time" class="label"></div>
  <div id="spinner" aria-hidden="true"></div>
  <button id="installButton" type="button">앱 설치</button>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("ko-KR", {
          year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
        }).format(now);
      document.getElementById("time").textContent =
        new Intl.DateTimeFormat("ko-KR", {
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        }).format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);

    // GitHub Pages 프로젝트 사이트에서도 상대 경로로 서비스 워커를 등록합니다.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .catch(err => console.error("Service worker registration failed:", err));
      });
    }

    // Chrome이 설치 이벤트를 제공할 경우에만 버튼을 표시합니다.
    let installPrompt = null;
    const installButton = document.getElementById("installButton");
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installButton.style.display = "block";
    });
    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.style.display = "none";
    });
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.style.display = "none";
    });
  </script>
</body>
</html>
