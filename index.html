<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="전체 화면 시계">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>Clock Screen</title>

  <style>
    /* ===== 여기의 값만 바꾸면 화면을 조정할 수 있습니다 ===== */
    :root {
      --date-y: 75%;
      --time-y: 81%;
      --icon-x: 50%;
      --icon-y: 90%;
      --date-size: 18px;
      --time-size: 32px;
      --text-color: #ffffff;
      --spin-speed: 2s;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    body {
      color: var(--text-color);
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      overscroll-behavior: none;
    }
    .background {
      position: fixed;
      inset: 0;
      background-image: url("./background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .label {
      position: fixed;
      left: 0;
      width: 100%;
      text-align: center;
      transform: translateY(-50%);
      text-shadow: 0 1px 8px #000;
      font-variant-numeric: tabular-nums;
      padding-inline: 12px;
      pointer-events: none;
    }
    #date { top: var(--date-y); font-size: var(--date-size); }
    #time { top: var(--time-y); font-size: var(--time-size); font-weight: 500; }
    
/* 24분할 도넛 로딩 아이콘 */
    #spinner {
  position: fixed;
  left: var(--icon-x, 50%);
  top: var(--icon-y, 50%);
  width: 256px;
  height: 256px;

  /* 24개 구간: 흰색에서 짙은 회색으로 */
  background: conic-gradient(
    #4B4B4B 2deg 13deg,
#494949 17deg 28deg,
#474747 32deg 43deg,
#454545 47deg 58deg,
#434343 62deg 73deg,
#414141 77deg 88deg,
#3F3F3F 92deg 103deg,
#3D3D3D 107deg 118deg,
#3B3B3B 122deg 133deg,
#393939 137deg 148deg,
#373737 152deg 163deg,
#353535 167deg 178deg,
#333333 182deg 193deg,
#313131 197deg 208deg,
#2F2F2F 212deg 223deg,
#2D2D2D 227deg 238deg,
#2C2C2C 242deg 253deg,
#2B2B2B 257deg 268deg,
#2A2A2A 272deg 283deg,
#292929 287deg 298deg,
#282828 302deg 313deg,
#262626 317deg 328deg,
#242424 332deg 343deg,
#222222 347deg 358deg
  );

  /* 바깥은 원형, 안쪽은 투명하게 마스킹 */
  -webkit-mask: radial-gradient(
    circle,
    transparent 0 104px,
    #000 105px 127px,
    transparent 128px
  );
  mask: radial-gradient(
    circle,
    transparent 0 104px,
    #000 105px 127px,
    transparent 128px
  );

  border-radius: 50%;
  transform-origin: center;
  animation: spin var(--spin-speed, 2s) steps(24, end) infinite;
}

@keyframes spin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; }
    }
    /* 설치 버튼은 Chrome이 설치 프롬프트를 제공할 때만 표시 */
    #installButton {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 10;
      border: 1px solid #ffffff88;
      border-radius: 999px;
      padding: 8px 12px;
      color: white;
      background: #111a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div id="date" class="label"></div>
  <div id="time" class="label"></div>
  <div id="spinner" aria-hidden="true"></div>
  <button id="installButton" type="button">앱 설치</button>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("ko-KR", {
          year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
        }).format(now);
      document.getElementById("time").textContent =
        new Intl.DateTimeFormat("ko-KR", {
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        }).format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);

    // GitHub Pages 프로젝트 사이트에서도 상대 경로로 서비스 워커를 등록합니다.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .catch(err => console.error("Service worker registration failed:", err));
      });
    }

    // Chrome이 설치 이벤트를 제공할 경우에만 버튼을 표시합니다.
    let installPrompt = null;
    const installButton = document.getElementById("installButton");
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installButton.style.display = "block";
    });
    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.style.display = "none";
    });
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.style.display = "none";
    });
  </script>
</body>
</html>
