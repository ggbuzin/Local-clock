<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="전체 화면 시계">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>Clock Screen</title>

  <style>
    /* ===== 여기의 값만 바꾸면 화면을 조정할 수 있습니다 ===== */
    :root {
      --date-y: 75%;
      --time-y: 81%;
      --icon-x: 50%;
      --icon-y: 65%;
      --date-size: 18px;
      --time-size: 32px;
      --text-color: #ffffff;
      --spin-speed: 2s;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    body {
      color: var(--text-color);
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
      overscroll-behavior: none;
    }
    .background {
      position: fixed;
      inset: 0;
      background-image: url("./background.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }
    .label {
      position: fixed;
      left: 0;
      width: 100%;
      text-align: center;
      transform: translateY(-50%);
      text-shadow: 0 1px 8px #000;
      font-variant-numeric: tabular-nums;
      padding-inline: 12px;
      pointer-events: none;
    }
    #date { top: var(--date-y); font-size: var(--date-size); }
    #time { top: var(--time-y); font-size: var(--time-size); font-weight: 500; }
    
/* 24분할 도넛 로딩 아이콘 */
    #spinner {
  position: fixed;
  left: var(--icon-x, 50%);
  top: var(--icon-y, 50%);
  width: 256px;
  height: 256px;

  /* 24개 구간: 흰색에서 짙은 회색으로 */
  background: conic-gradient(
  transparent 0deg 2deg,
  #222222 2deg 13deg,
  transparent 13deg 17deg,
  #242424 17deg 28deg,
  transparent 28deg 32deg,
  #262626 32deg 43deg,
  transparent 43deg 47deg,
  #282828 47deg 58deg,
  transparent 58deg 62deg,
  #292929 62deg 73deg,
  transparent 73deg 77deg,
  #2A2A2A 77deg 88deg,
  transparent 88deg 92deg,
  #2B2B2B 92deg 103deg,
  transparent 103deg 107deg,
  #2C2C2C 107deg 118deg,
  transparent 118deg 122deg,
  #2D2D2D 122deg 133deg,
  transparent 133deg 137deg,
  #2F2F2F 137deg 148deg,
  transparent 148deg 152deg,
  #313131 152deg 163deg,
  transparent 163deg 167deg,
  #333333 167deg 178deg,
  transparent 178deg 182deg,
  #353535 182deg 193deg,
  transparent 193deg 197deg,
  #373737 197deg 208deg,
  transparent 208deg 212deg,
  #393939 212deg 223deg,
  transparent 223deg 227deg,
  #3B3B3B 227deg 238deg,
  transparent 238deg 242deg,
  #3D3D3D 242deg 253deg,
  transparent 253deg 257deg,
  #3F3F3F 257deg 268deg,
  transparent 268deg 272deg,
  #414141 272deg 283deg,
  transparent 283deg 287deg,
  #434343 287deg 298deg,
  transparent 298deg 302deg,
  #454545 302deg 313deg,
  transparent 313deg 317deg,
  #474747 317deg 328deg,
  transparent 328deg 332deg,
  #494949 332deg 343deg,
  transparent 343deg 347deg,
  #4B4B4B 347deg 358deg,
  transparent 358deg 360deg
);

  /* 바깥은 원형, 안쪽은 투명하게 마스킹 */
  -webkit-mask: radial-gradient(
    circle,
    transparent 0 104px,
    #000 105px 127px,
    transparent 128px
  );
  mask: radial-gradient(
    circle,
    transparent 0 104px,
    #000 105px 127px,
    transparent 128px
  );

  border-radius: 50%;
  transform-origin: center;
  animation: spin var(--spin-speed, 2s) steps(24, end) infinite;
}

@keyframes spin {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}

    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; }
    }
    /* 설치 버튼은 Chrome이 설치 프롬프트를 제공할 때만 표시 */
    #installButton {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 10;
      border: 1px solid #ffffff88;
      border-radius: 999px;
      padding: 8px 12px;
      color: white;
      background: #111a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div id="date" class="label"></div>
  <div id="time" class="label"></div>
  <div id="spinner" aria-hidden="true"></div>
  <button id="installButton" type="button">앱 설치</button>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("ko-KR", {
          year: "numeric", month: "2-digit", day: "2-digit", weekday: "short"
        }).format(now);
      document.getElementById("time").textContent =
        new Intl.DateTimeFormat("ko-KR", {
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        }).format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);

    // GitHub Pages 프로젝트 사이트에서도 상대 경로로 서비스 워커를 등록합니다.
    if ("serviceWorker" in navigator) {
  let refreshing = false;

  navigator.serviceWorker.addEventListener(
    "controllerchange",
    () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    }
  );

  window.addEventListener("load", async () => {
    try {
      const registration =
        await navigator.serviceWorker.register("./sw.js");

      await registration.update();
    } catch (error) {
      console.error("앱 업데이트 확인 실패:", error);
    }
  });

  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible") return;

    const registration =
      await navigator.serviceWorker.getRegistration();

    if (registration) {
      registration.update().catch(console.error);
    }
  });
    }

    // Chrome이 설치 이벤트를 제공할 경우에만 버튼을 표시합니다.
    let installPrompt = null;
    const installButton = document.getElementById("installButton");
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installButton.style.display = "block";
    });
    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.style.display = "none";
    });
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.style.display = "none";
    });
  </script>
</body>
</html>
